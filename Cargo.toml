[package]
name = "boost_asio"
description = "Boost C++ library boost_asio packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_asio"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_asio"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_align = { version = "0.1.0", path = "../boost_align" }
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_config = { version = "0.1.0", path = "../boost_config" }
boost_context = { version = "0.1.0", path = "../boost_context" }
boost_date_time = { version = "0.1.0", path = "../boost_date_time" }
boost_system = { version = "0.1.0", path = "../boost_system" }
boost_throw_exception = { version = "0.1.0", path = "../boost_throw_exception" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
